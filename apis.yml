aid: crash-override
name: Crash Override
description: 'Crash Override is a software supply chain security company building a
  control plane for software development in the agentic era. It monitors code from
  developers and AI coding agents, inspects builds across CI/CD systems (GitHub Actions,
  GitLab CI, CircleCI, Jenkins), cryptographically tags software artifacts, and tracks
  them from development through production. The company delivers its capabilities primarily
  through open-source tools — Chalk (code provenance tagging) and Ocular (Kubernetes-native
  software asset scanning orchestration) — plus a hosted control plane with enterprise
  SAML 2.0, OIDC, and SCIM support. Founded by Mark Curphey (founder of OWASP) and
  John Viega, and backed by GV, Syn Ventures, Bessemer Venture Partners, and Blackstone.
  Philosophy: "Tag. Track. Trust." No public REST API or OpenAPI specification is published
  at this time; this profile was enriched from the company''s public web, GitHub org,
  and security surface.'
